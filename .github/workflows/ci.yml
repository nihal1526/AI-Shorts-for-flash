name: FlashKlap CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install FFmpeg & fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-freefont-ttf

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Backend Import
      run: |
        python -c "import backend.app; print('Backend loaded successfully!')"

